plugins {
    // Apply the application plugin to add support for building a CLI application in Java.
    id 'application'
    id 'com.google.protobuf' version '0.10.0'
}


repositories {
  maven { // The google mirror is less flaky than mavenCentral()
    url "https://maven-central.storage-download.googleapis.com/maven2/" 
  }
  mavenCentral()
  mavenLocal()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(26)
    }
}

// Declare and update the version in our release process.
def grpcVersion = '1.82.2' // CURRENT_GRPC_VERSION
def protobufVersion = '4.31.1'
def protocVersion = protobufVersion

dependencies {
    // Use JUnit test framework.
    testImplementation 'junit:junit:4.13'
    testImplementation "io.grpc:grpc-inprocess:${grpcVersion}"
    testImplementation "io.grpc:grpc-testing:${grpcVersion}"
    testImplementation 'org.mockito:mockito-core:3.4.0' 

    // This dependency is used by the application.
    implementation 'com.google.guava:guava:29.0-jre'
    implementation "com.google.protobuf:protobuf-java:${protobufVersion}"
    implementation "io.grpc:grpc-netty-shaded:${grpcVersion}"
    implementation "io.grpc:grpc-protobuf:${grpcVersion}"
    implementation "io.grpc:grpc-stub:${grpcVersion}"
    compileOnly 'org.apache.tomcat:annotations-api:6.0.53' // necessary for Java 9+

}

protobuf {
  protoc {
    artifact = "com.google.protobuf:protoc:${protocVersion}"
  }
  plugins {
    grpc {
      artifact = "io.grpc:protoc-gen-grpc-java:${grpcVersion}"
    }
  }
  generateProtoTasks {
    all()*.plugins {
      grpc {}
    }
  }
}


// Inform IDEs like IntelliJ IDEA, VSCode, Eclipse or NetBeans about the generated code.
sourceSets {
    main {
        java {
            srcDirs 'build/generated/source/proto/main/grpc'
            srcDirs 'build/generated/source/proto/main/java'
        }
    }
}

startScripts.enabled = false

task helloServer(type: CreateStartScripts) {
    mainClass = 'com.apidemo.grpc.HelloServer'
    applicationName = 'hello-server'
    outputDir = new File(project.buildDir, 'tmp')
    classpath = startScripts.classpath
}

task helloClient(type: CreateStartScripts) {
    mainClass = 'com.apidemo.grpc.HelloClient'
    applicationName = 'hello-client'
    outputDir = new File(project.buildDir, 'tmp')
    classpath = startScripts.classpath
}

distributions {
  main {
    contents {
      into('bin') {
        from(helloServer)
        from(helloClient)
        filePermissions {
          unix(0755)
        }
      }
    }
  }
}

